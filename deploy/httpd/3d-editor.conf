# The 3D-Editor under a path of a site served by Apache httpd (docs/subpath.md): the editor at
# https://example.com/3d/, the embeddable desk at https://example.com/3d/desk.html.
#
# Needs httpd 2.4.47 or later with mod_proxy, mod_proxy_http, mod_headers, mod_rewrite and, for TLS,
# mod_ssl (on Debian and Ubuntu: a2enmod proxy proxy_http headers rewrite ssl). For a site that has
# a VirtualHost already, copy the lines between the VirtualHost tags into it, without the TLS ones.
# To change: the host name (ServerName and the certificate's paths), the prefix (/3d: in the
# RewriteRule, the Location and X-Forwarded-Prefix) and the editor server's address
# (127.0.0.1:8080, twice).
<VirtualHost *:443>
    ServerName example.com
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/example.com/privkey.pem

    # Apache httpd 2.4.47 or later (mod_proxy, mod_proxy_http, mod_headers, mod_rewrite), in the site's VirtualHost
    RewriteEngine On
    RewriteRule ^/3d$ /3d/ [R=308,L,QSA]
    ProxyPreserveHost On
    <Location "/3d/">
        RequestHeader set X-Forwarded-Prefix "/3d"
        RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
        ProxyPass http://127.0.0.1:8080/ upgrade=websocket flushpackets=on timeout=3600
        ProxyPassReverse http://127.0.0.1:8080/
    </Location>

    # the rest of the site, for example:
    # DocumentRoot /var/www/html
</VirtualHost>
