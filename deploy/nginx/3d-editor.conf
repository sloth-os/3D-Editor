# The 3D-Editor under a path of a site served by nginx (docs/subpath.md): the editor at
# https://example.com/3d/, the embeddable desk at https://example.com/3d/desk.html.
#
# This file belongs in nginx's http context (for example as /etc/nginx/conf.d/3d-editor.conf). For a
# site that has a server block already, copy the two location blocks into it, and the map into the
# http context unless it has a map for $connection_upgrade already.
# To change: the host name (server_name and the certificate's paths), the prefix (/3d: in both
# locations, the redirect and X-Forwarded-Prefix) and the editor server's address (127.0.0.1:8080).
#
# nginx (http context): the trailing slash of proxy_pass strips /3d
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
    # listen, server_name and TLS as for the rest of the site
    listen 443 ssl;
    server_name example.com;
    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    location = /3d { return 308 /3d/$is_args$args; }
    location /3d/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /3d;
        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 0;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # the rest of the site, for example:
    # location / { root /var/www/html; }
}
